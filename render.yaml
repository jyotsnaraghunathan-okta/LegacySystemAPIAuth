services:
  # The legacy platform itself: Basic Auth -> session ID.
  - type: web
    name: api-basic-auth
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # main.py reads $PORT itself; uvicorn binds 0.0.0.0 so Render can route to it.
    startCommand: python main.py
    healthCheckPath: /health
    envVars:
      # Credentials as a JSON object: {"username":"password", ...}
      # Set in the Render dashboard — never commit real values.
      # Without this, main.py falls back to development defaults and logs a warning.
      - key: API_USERS
        sync: false
      # Session lifetime in seconds (default 1800).
      - key: SESSION_TTL_SECONDS
        value: "1800"
      # When true, each authenticated request pushes the expiry forward.
      - key: SLIDING_EXPIRY
        value: "true"
      # Legacy platforms often use JSESSIONID or ASP.NET_SessionId.
      - key: SESSION_COOKIE_NAME
        value: "SESSIONID"
      # Render terminates TLS, so the session cookie can be Secure.
      - key: COOKIE_SECURE
        value: "true"
      - key: BASIC_AUTH_REALM
        value: "Legacy Platform"

  # The MCP wrapper, served at /mcp. Holds no credentials: it forwards the
  # Authorization header injected by the upstream gateway.
  - type: web
    name: api-basic-auth-mcp
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # --http is required. Without it mcp_server.py runs in stdio mode and
    # binds no port, so Render's health check never passes.
    startCommand: python mcp_server.py --http $PORT
    # /mcp rejects unauthenticated GETs by design, so it cannot serve as a
    # health check. The platform's own /health is checked on its service.
    envVars:
      # Which platform instance to wrap. Points at the sibling service above.
      - key: PLATFORM_BASE_URL
        value: "https://api-basic-auth.onrender.com"
      # Generous: the free plan sleeps when idle, and the first request after
      # a sleep can take ~60s.
      - key: HTTP_TIMEOUT_SECONDS
        value: "90"
      # PLATFORM_USERNAME and PLATFORM_PASSWORD are deliberately absent.
      # The gateway injects credentials per request; setting them here would
      # store a credential in this service, which the design avoids.
